name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    name: Unsigned IPA for TrollStore
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject latest sources
        run: |
          python3 - <<'PY'
          import base64, pathlib
          FILES = {
           'Video2/Assets.xcassets/AccentColor.colorset/Contents.json': '',
           'Video2/Assets.xcassets/AppIcon.appiconset/Contents.json': 'ewogICJpbWFnZXMiIDogWwogICAgewogICAgICAiZmlsZW5hbWUiIDogIkFwcEljb24ucG5nIiwKICAgICAgImlkaW9tIiA6ICJ1bml2ZXJzYWwiLAogICAgICAicGxhdGZvcm0iIDogImlvcyIsCiAgICAgICJzaXplIiA6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyIgOiB7CiAgICAiYXV0aG9yIiA6ICJ4Y29kZSIsCiAgICAidmVyc2lvbiIgOiAxCiAgfQp9Cg==',
           'Video2/Assets.xcassets/Contents.json': 'eyJpbmZvIjp7ImF1dGhvciI6Inhjb2RlIiwidmVyc2lvbiI6MX19Cg==',
           'Video2/Info.plist': '',
           'Video2/Models/Models.swift': '',
           'Video2/Resources/adblock-rules.json': '',
           'Video2/Services/AdBlock.swift': '',
           'Video2/Services/BrowserModel.swift': '',
           'Video2/Services/DownloadManager.swift': '',
           'Video2/Services/ExtractorScript.swift': '',
           'Video2/Services/HLSDownloader.swift': '',
           'Video2/Services/LibraryStore.swift': '',
           'Video2/Services/LocalFileServer.swift': '',
           'Video2/Services/MediaProbe.swift': '',
           'Video2/Services/Thumbnailer.swift': '',
           'Video2/Video2.entitlements': '',
           'Video2/Video2App.swift': '',
           'Video2/Views/BrowserView.swift': '',
           'Video2/Views/DownloadsView.swift': '',
           'Video2/Views/LibraryView.swift': '',
           'Video2/Views/OfflinePlayerView.swift': '',
           'Video2/Views/RootView.swift': '',
           'Video2/Views/SettingsView.swift': '',
           'Video2/Views/Theme.swift': '',
           'Video2/Views/WebView.swift': '',
           'Video2.xcodeproj/project.pbxproj': '',
           'Video2.xcodeproj/xcshareddata/xcschemes/Video2.xcscheme': '',
          }
          for rel, b64 in FILES.items():
              p = pathlib.Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
              print('wrote', rel, p.stat().st_size)
          PY

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            XAPP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | tail -n 1)
            sudo xcode-select -s "$XAPP"
          fi
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project Video2.xcodeproj -scheme Video2 -configuration Release -sdk iphoneos -derivedDataPath derived -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PRODUCT_BUNDLE_IDENTIFIER=com.ahcrazy.video2 IPHONEOS_DEPLOYMENT_TARGET=16.4 ONLY_ACTIVE_ARCH=NO build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find derived/Build/Products -name Video2.app -type d | head -n 1)
          test -n "$APP"
          rm -rf Payload Video2.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Video2.ipa Payload
          ls -lh Video2.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Video2-TrollStore
          path: Video2.ipa
          if-no-files-found: error
