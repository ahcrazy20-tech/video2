      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            XAPP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | tail -n 1)
            sudo xcode-select -s "$XAPP"
          fi
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project Video2.xcodeproj -scheme Video2 -configuration Release -sdk iphoneos -derivedDataPath derived -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PRODUCT_BUNDLE_IDENTIFIER=com.ahcrazy.video2 IPHONEOS_DEPLOYMENT_TARGET=16.4 ONLY_ACTIVE_ARCH=NO build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find derived/Build/Products -name Video2.app -type d | head -n 1)
          test -n "$APP"
          rm -rf Payload Video2.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Video2.ipa Payload
          ls -lh Video2.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Video2-TrollStore
          path: Video2.ipa
          if-no-files-found: error
